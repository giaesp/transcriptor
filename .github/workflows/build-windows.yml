name: Build Windows installer

on:
  workflow_dispatch:        # avvio manuale dalla tab Actions
  push:
    tags: ["v*"]            # es. git tag v0.1.0 && git push --tags  -> crea una Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: models/faster-whisper-medium
          key: whisper-medium-v1

      - name: Download model
        run: |
          if (-not (Test-Path models/faster-whisper-medium/model.bin)) { python scripts/download_model.py medium }

      - name: Smoke test (import + resume logic)
        run: python -c "import faster_whisper, ctranslate2, av, docx, PySide6; from app import worker; print('ok')"

      - name: PyInstaller
        run: pyinstaller build/transcriptor.spec --noconfirm --distpath dist --workpath build/work

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transcriptor-Setup
          path: dist/installer/*.exe
          retention-days: 7
          compression-level: 0

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
